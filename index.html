<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Where in the World?</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a1628; --gold: #f0a500; --gold2: #ffd166;
  --white: #f5f0e8; --green: #2ecc71; --red: #e74c3c;
  --card: rgba(255,255,255,0.06); --border: rgba(240,165,0,0.28);
}
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--white); min-height: 100vh; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* SCREENS */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }

/* HOME */
#home { align-items: center; justify-content: center; text-align: center; gap: 22px; padding: 28px; }
.globe { font-size: 120px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
h1 { font-family: Georgia, serif; font-size: 38px; font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.subtitle { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: rgba(245,240,232,0.45); }
.tagline { font-size: 14px; color: rgba(245,240,232,0.7); line-height: 1.6; max-width: 280px; }
.btn { background: linear-gradient(135deg, var(--gold), #e09000); color: #0a1628;
  border: none; padding: 15px 0; border-radius: 50px; font-size: 15px; font-weight: 700;
  cursor: pointer; width: 100%; letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 10px; transition: transform .2s; }
.btn:hover { transform: translateY(-2px); }
.btn2 { background: transparent; color: var(--white); border: 1px solid rgba(245,240,232,0.3);
  padding: 13px 0; border-radius: 50px; font-size: 14px; cursor: pointer;
  width: 100%; margin-bottom: 10px; transition: all .2s; }
.btn2:hover { border-color: var(--gold); color: var(--gold); }

/* LEVEL SELECT */
#levelselect { padding: 20px; gap: 10px; overflow-y: auto; }
.sel-header { display: flex; align-items: center; gap: 14px; padding-top: 8px; margin-bottom: 6px; }
.back { background: var(--card); border: 1px solid var(--border); color: var(--white);
  width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 18px; flex-shrink: 0; }
h2 { font-family: Georgia, serif; font-size: 25px; font-weight: 700; }
.lvl-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 13px 17px; display: flex; align-items: center; gap: 13px;
  cursor: pointer; transition: all .2s; }
.lvl-card:hover:not(.locked) { border-color: var(--gold); transform: translateX(4px); }
.lvl-card.locked { opacity: .4; cursor: not-allowed; }
.lvl-card.done { border-color: rgba(46,204,113,.4); }
.lvl-num { width: 44px; height: 44px; border-radius: 12px; background: rgba(240,165,0,.15);
  border: 1px solid rgba(240,165,0,.3); display: flex; align-items: center;
  justify-content: center; font-family: Georgia, serif; font-size: 18px;
  font-weight: 700; color: var(--gold); flex-shrink: 0; }
.lvl-info { flex: 1; }
.lvl-name { font-weight: 600; font-size: 14px; }
.lvl-desc { font-size: 12px; color: rgba(245,240,232,.5); margin-top: 2px; }

/* GAME */
#game { padding: 0; }
.game-hdr { padding: 13px 17px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.06); }
.badge { background: linear-gradient(135deg, var(--gold), #e09000); color: #0a1628;
  font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  padding: 5px 11px; border-radius: 20px; }
.pbar-wrap { height: 3px; background: rgba(255,255,255,.08); }
.pbar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2));
  transition: width .4s; }
.img-box { position: relative; width: 100%; background: #0d2b4e; overflow: hidden; }
.img-box img { width: 100%; height: 280px; object-fit: cover; display: block;
  transition: opacity .4s; }
.img-overlay { position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 55%, rgba(10,22,40,.9) 100%);
  pointer-events: none; }
.img-label { position: absolute; bottom: 13px; left: 13px; right: 13px;
  font-family: Georgia, serif; font-size: 16px; font-weight: 700;
  text-shadow: 0 2px 8px rgba(0,0,0,.9); }
.hint-tag { position: absolute; top: 10px; right: 10px;
  background: rgba(10,22,40,.8); border: 1px solid rgba(240,165,0,.35);
  color: var(--gold2); font-size: 10px; font-weight: 600; letter-spacing: 1px;
  padding: 3px 9px; border-radius: 20px; text-transform: uppercase; }
.img-placeholder { width: 100%; height: 280px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  background: linear-gradient(135deg, #0d2b4e, #1a3a5c); }
.spin { font-size: 44px; animation: spin 2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.img-placeholder p { font-size: 12px; color: rgba(245,240,232,.5); }
.opts { padding: 13px 17px; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.opt { background: var(--card); border: 1px solid var(--border); color: var(--white);
  padding: 13px 9px; border-radius: 13px; font-size: 13px; font-weight: 500;
  cursor: pointer; text-align: center; line-height: 1.3; transition: all .2s; }
.opt:hover:not(:disabled) { border-color: var(--gold); background: rgba(240,165,0,.1); }
.opt.correct { background: rgba(46,204,113,.2); border-color: var(--green); color: #7fffb0; }
.opt.wrong   { background: rgba(231,76,60,.2);  border-color: var(--red);   color: #ff9f9f; }
.feedback { padding: 11px 17px; text-align: center; font-weight: 600; font-size: 14px;
  min-height: 46px; display: flex; align-items: center; justify-content: center; }

/* RESULT */
#result { align-items: center; justify-content: center; text-align: center;
  gap: 20px; padding: 28px; }
.res-icon { font-size: 72px; animation: float 2s ease-in-out infinite; }
.res-title { font-family: Georgia, serif; font-size: 34px; font-weight: 900; }
.res-title.win { color: var(--gold); }
.res-title.lose { color: rgba(245,240,232,.7); }
.res-score { font-family: Georgia, serif; font-size: 64px; font-weight: 900;
  color: var(--gold); line-height: 1; }
.res-msg { font-size: 14px; color: rgba(245,240,232,.6); max-width: 260px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="home" class="screen active">
  <div class="globe">&#127757;</div>
  <div>
    <h1>Where in the World?</h1>
    <div class="subtitle">Geography Challenge</div>
  </div>
  <div class="tagline">Test your knowledge of the world's most iconic and hidden places across 10 levels.</div>
  <div style="width:100%">
    <button class="btn" onclick="startLevel(0)">Start Playing</button>
    <button class="btn2" onclick="showScreen('levelselect')">Select Level</button>
  </div>
</div>

<!-- LEVEL SELECT -->
<div id="levelselect" class="screen">
  <div class="sel-header">
    <button class="back" onclick="showScreen('home')">&#8592;</button>
    <h2>Choose Level</h2>
  </div>
  <div id="lvl-list"></div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="game-hdr">
    <div class="badge" id="g-badge">Level 1</div>
    <div style="font-size:13px;color:rgba(245,240,232,.6)" id="g-progress">1 / 10</div>
    <div style="font-size:15px" id="g-lives"></div>
  </div>
  <div class="pbar-wrap"><div class="pbar" id="pbar" style="width:0%"></div></div>
  <div class="img-box">
    <div class="img-placeholder" id="img-ph">
      <div class="spin">&#127760;</div>
      <p>Loading image...</p>
    </div>
    <img id="g-img" src="" alt="" style="opacity:0">
    <div class="img-overlay"></div>
    <div class="img-label">&#127757; Where in the world is this?</div>
    <div class="hint-tag" id="g-hint">World Icons</div>
  </div>
  <div class="opts" id="g-opts"></div>
  <div class="feedback" id="g-fb"></div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="res-icon" id="r-icon">&#127942;</div>
  <div class="res-title" id="r-title">Level Complete!</div>
  <div class="res-score" id="r-score">10/10</div>
  <div style="font-size:16px;color:rgba(245,240,232,.7)" id="r-sub">Perfect score!</div>
  <div class="res-msg" id="r-msg"></div>
  <div style="width:100%">
    <button class="btn" id="r-primary" onclick="primaryAction()">Next Level</button>
    <button class="btn2" onclick="showScreen('levelselect')">Level Select</button>
    <button class="btn2" onclick="showScreen('home')">Home</button>
  </div>
</div>

</div>

// ── GAME STATE ──
var G = {
  lvl: 0, qi: 0, score: 0, lives: 3, answered: false, pool: [],
  prog: (function(){ try{ return JSON.parse(localStorage.getItem('witw5')||'{}'); }catch(e){ return {}; } })()
};

function save(){ try{ localStorage.setItem('witw5', JSON.stringify(G.prog)); }catch(e){} }

function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length-1; i > 0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  if(id === 'levelselect') buildLevelList();
}

function buildLevelList(){
  var el = document.getElementById('lvl-list');
  el.innerHTML = '';
  for(var i = 0; i < LEVELS.length; i++){
    (function(i){
      var unlocked = (i === 0) || !!(G.prog[i-1] && G.prog[i-1].done);
      var done = !!(G.prog[i] && G.prog[i].done);
      var d = document.createElement('div');
      d.className = 'lvl-card' + (unlocked ? '' : ' locked') + (done ? ' done' : '');
      d.innerHTML =
        '<div class="lvl-num">'+(i+1)+'</div>'+
        '<div class="lvl-info">'+
          '<div class="lvl-name">'+LEVELS[i].name+'</div>'+
          '<div class="lvl-desc">'+LEVELS[i].desc+'</div>'+
        '</div>'+
        '<div style="font-size:18px">'+(unlocked ? (done ? '&#9989;' : '&#9654;&#65039;') : '&#128274;')+'</div>';
      if(unlocked){ d.onclick = function(){ startLevel(i); }; }
      el.appendChild(d);
    })(i);
  }
}

function startLevel(i){
  G.lvl = i; G.qi = 0; G.score = 0; G.lives = 3; G.answered = false;
  var pool = LEVELS[i].questions.slice();
  pool = shuffle(pool).slice(0, 10);
  G.pool = pool;
  showScreen('game');
  renderQ();
}

function renderQ(){
  var q = G.pool[G.qi];
  var lvl = LEVELS[G.lvl];
  document.getElementById('g-badge').textContent = 'Level '+(G.lvl+1);
  document.getElementById('g-progress').textContent = (G.qi+1)+' / 10';
  document.getElementById('g-lives').innerHTML = hearts();
  document.getElementById('pbar').style.width = (G.qi/10*100)+'%';
  document.getElementById('g-hint').textContent = lvl.hint;
  document.getElementById('g-fb').textContent = '';
  document.getElementById('g-fb').style.color = '';

  // Image loading
  var img = document.getElementById('g-img');
  var ph = document.getElementById('img-ph');
  img.style.opacity = '0';
  ph.style.display = 'flex';
  ph.querySelector('p').textContent = 'Loading image...';
  ph.querySelector('.spin').style.animation = 'spin 2s linear infinite';

  img.onload = function(){
    img.style.opacity = '1';
    ph.style.display = 'none';
  };
  img.onerror = function(){
    ph.querySelector('.spin').style.animation = 'none';
    ph.querySelector('.spin').innerHTML = '&#127757;';
    ph.querySelector('p').textContent = 'Guess from the options!';
  };
  img.src = q.img;

  // Options
  var opts = shuffle(q.opts);
  var grid = document.getElementById('g-opts');
  grid.innerHTML = '';
  for(var j = 0; j < opts.length; j++){
    (function(opt){
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt;
      btn.onclick = function(){ handleAnswer(opt); };
      grid.appendChild(btn);
    })(opts[j]);
  }
  G.answered = false;
}

function hearts(){
  var h = '';
  for(var i=0;i<3;i++) h += (i < G.lives) ? '&#10084;&#65039;' : '&#128420;';
  return h;
}

function handleAnswer(chosen){
  if(G.answered) return;
  G.answered = true;
  var q = G.pool[G.qi];
  var ok = chosen === q.ans;

  document.querySelectorAll('.opt').forEach(function(btn){
    btn.disabled = true;
    if(btn.textContent === q.ans) btn.classList.add('correct');
    else if(btn.textContent === chosen && !ok) btn.classList.add('wrong');
  });

  var fb = document.getElementById('g-fb');
  if(ok){
    G.score++;
    fb.textContent = '✓ Correct!';
    fb.style.color = '#2ecc71';
  } else {
    G.lives--;
    fb.textContent = '✗ Answer: ' + q.ans;
    fb.style.color = '#e74c3c';
    document.getElementById('g-lives').innerHTML = hearts();
  }

  setTimeout(function(){
    if(G.lives <= 0){ showResult(false); return; }
    G.qi++;
    if(G.qi >= 10) showResult(G.score === 10);
    else renderQ();
  }, 1600);
}

function showResult(passed){
  document.getElementById('r-icon').innerHTML = passed ? '&#127942;' : '&#127760;';
  document.getElementById('r-title').textContent = passed ? 'Level Complete!' : 'Not Quite!';
  document.getElementById('r-title').className = 'res-title ' + (passed ? 'win' : 'lose');
  document.getElementById('r-score').textContent = G.score + '/10';
  document.getElementById('r-sub').textContent = passed ? 'Perfect score — next level unlocked!' : 'You need 10/10 to pass';
  document.getElementById('r-msg').textContent = passed
    ? 'You mastered "' + LEVELS[G.lvl].name + '". Ready for the next challenge?'
    : 'You got ' + G.score + ' right. Try again for a perfect score!';
  var pb = document.getElementById('r-primary');
  if(passed && G.lvl < 9){ pb.textContent = 'Next Level →'; }
  else { pb.textContent = 'Try Again'; }
  if(passed){ G.prog[G.lvl] = {done:true}; save(); }
  showScreen('result');
}

function primaryAction(){
  if(G.prog[G.lvl] && G.prog[G.lvl].done && G.lvl < 9) startLevel(G.lvl+1);
  else startLevel(G.lvl);
}
